<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldNoor" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle ambient inner glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="3" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#34d399" stroke-opacity="0.08" stroke-width="2" />

  <!-- Noor Chat Main Radiant Bubble Group -->
  <g transform="translate(256, 256)">
    <!-- Chat bubble back shadow/glow -->
    <path d="M-120 -60 C-120 -130, -70 -160, 0 -160 C70 -160, 120 -130, 120 -60 C120 10, 70 60, 0 60 C-30 60, -60 50, -85 35 L-130 55 L-115 10 C-120 -15, -120 -35, -120 -60 Z" 
          fill="#10b981" opacity="0.25" filter="url(#glow)" />

    <!-- Chat Bubble Body -->
    <path d="M-110 -50 C-110 -115, -60 -145, 0 -145 C60 -145, 110 -115, 110 -50 C110 15, 60 55, 0 55 C-25 55, -50 45, -75 30 L-115 48 L-102 10 C-108 -10, -110 -30, -110 -50 Z" 
          fill="url(#emeraldGlow)" />

    <!-- Center Radiant 8-Point Noor Star (Divine Radiance / Light) -->
    <g transform="translate(0, -45) scale(0.9)">
      <!-- Star rays -->
      <path d="M0 -75 L12 -22 L65 -35 L22 5 L55 50 L5 24 L-20 65 L-12 12 L-65 18 L-22 -8 L-55 -45 L-5 -22 Z" 
            fill="url(#goldNoor)" filter="url(#glow)" />
      <!-- Center bright core -->
      <circle cx="0" cy="0" r="16" fill="#ffffff" />
      <circle cx="0" cy="0" r="26" fill="#fef08a" opacity="0.6" />
    </g>

    <!-- Signal / Radiance Wave Lines (Connecting people) -->
    <path d="M-60 85 Q0 120 60 85" fill="none" stroke="url(#goldNoor)" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <path d="M-40 105 Q0 135 40 105" fill="none" stroke="url(#goldNoor)" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    <circle cx="0" cy="138" r="4" fill="#fbbf24" />
  </g>
</svg>
